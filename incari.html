<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator Suite v4.2</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e1e1e;
            font-family: Arial, sans-serif;
        }

        #calculator-ui {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background: #1e1e1e;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        .calc-box {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 300px;
        }
        .calc-display {
            width: 100%;
            height: 40px;
            background: #111;
            color: #0f0;
            font-size: 20px;
            text-align: right;
            padding: 5px 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
            border: 1px solid #444;
        }
        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .calc-btn {
            padding: 15px;
            font-size: 16px;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .calc-btn:hover { background: #555; }

        /* Offline Game Container */
        #game-wrapper {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #111;
            z-index: 999;
            color: #fff;
            text-align: center;
            font-family: monospace;
        }
        canvas {
            background: #000;
            display: block;
            margin: auto;
            margin-top: 20px;
            border: 2px solid #0f0;
        }
    </style>
</head>
<body>

    <div id="calculator-ui">
        <div class="calc-box">
            <div class="calc-display" id="display">0</div>
            <div class="calc-buttons">
                <button class="calc-btn" onclick="press('7')">7</button>
                <button class="calc-btn" onclick="press('8')">8</button>
                <button class="calc-btn" onclick="press('9')">9</button>
                <button class="calc-btn" onclick="press('/')">/</button>
                <button class="calc-btn" onclick="press('4')">4</button>
                <button class="calc-btn" onclick="press('5')">5</button>
                <button class="calc-btn" onclick="press('6')">6</button>
                <button class="calc-btn" onclick="press('*')">*</button>
                <button class="calc-btn" onclick="press('1')">1</button>
                <button class="calc-btn" onclick="press('2')">2</button>
                <button class="calc-btn" onclick="press('3')">3</button>
                <button class="calc-btn" onclick="press('-')">-</button>
                <button class="calc-btn" onclick="press('0')">0</button>
                <button class="calc-btn" onclick="clearCalc()">C</button>
                <button class="calc-btn" onclick="evaluateCalc()">=</button>
                <button class="calc-btn" onclick="press('+')">+</button>
            </div>
        </div>
    </div>

    <!-- Self-contained local game canvas so it never blocks -->
    <div id="game-wrapper">
        <h2 style="color: #0f0; margin-top: 15px;">Incari Client // Offline Mode</h2>
        <p style="font-size: 14px; color: #aaa;">Use Arrow Keys / Touch to move</p>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <p style="margin-top: 10px;"><button onclick="location.reload()" style="padding:8px 16px; background:#333; color:#fff; border:1px solid #666; cursor:pointer;">Lock / Reset Vault</button></p>
    </div>

    <script>
        let inputSequence = "";
        const targetSequence = "0024";

        function press(val) {
            let display = document.getElementById("display");
            if (display.innerText === "0") display.innerText = "";
            display.innerText += val;
            
            inputSequence += val;
            if (inputSequence.includes(targetSequence)) {
                launchClient();
            }
        }

        function clearCalc() {
            document.getElementById("display").innerText = "0";
            inputSequence = "";
        }

        function evaluateCalc() {
            try {
                let display = document.getElementById("display");
                display.innerText = eval(display.innerText);
            } catch (e) {
                document.getElementById("display").innerText = "Error";
            }
        }

        function launchClient() {
            document.getElementById("calculator-ui").style.display = "none";
            document.getElementById("game-wrapper").style.display = "block";
            startCanvasGame();
        }

        // Native offline mini-game engine
        function startCanvasGame() {
            const canvas = document.getElementById("gameCanvas");
            const ctx = canvas.getContext("2d");
            let x = 200, y = 200, score = 0;
            let targetX = Math.random() * 350 + 25, targetY = Math.random() * 350 + 25;

            window.addEventListener('keydown', (e) => {
                if(e.key === "ArrowUp") y -= 15;
                if(e.key === "ArrowDown") y += 15;
                if(e.key === "ArrowLeft") x -= 15;
                if(e.key === "ArrowRight") x += 15;
            });

            function update() {
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw Target
                ctx.fillStyle = "#f00";
                ctx.fillRect(targetX, targetY, 20, 20);

                // Draw Player
                ctx.fillStyle = "#0f0";
                ctx.fillRect(x, y, 20, 20);

                // Score text
                ctx.fillStyle = "#fff";
                ctx.font = "14px monospace";
                ctx.fillText("Score: " + score, 15, 25);

                // Collision detection
                let dist = Math.hypot(x - targetX, y - targetY);
                if(dist < 20) {
                    score++;
                    targetX = Math.random() * 350 + 25;
                    targetY = Math.random() * 350 + 25;
                }

                requestAnimationFrame(update);
            }
            update();
        }
    </script>
</body>
</html>
