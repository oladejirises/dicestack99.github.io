<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator Suite v4.2</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e1e1e;
            font-family: Arial, sans-serif;
        }

        #calculator-ui {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background: #1e1e1e;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        .calc-box {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 300px;
        }
        .calc-display {
            width: 100%;
            height: 40px;
            background: #111;
            color: #0f0;
            font-size: 20px;
            text-align: right;
            padding: 5px 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
            border: 1px solid #444;
        }
        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .calc-btn {
            padding: 15px;
            font-size: 16px;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .calc-btn:hover { background: #555; }

        /* Actual Client Iframe Frame */
        #game-wrapper {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 999;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="calculator-ui">
        <div class="calc-box">
            <div class="calc-display" id="display">0</div>
            <div class="calc-buttons">
                <button class="calc-btn" onclick="press('7')">7</button>
                <button class="calc-btn" onclick="press('8')">8</button>
                <button class="calc-btn" onclick="press('9')">9</button>
                <button class="calc-btn" onclick="press('/')">/</button>
                <button class="calc-btn" onclick="press('4')">4</button>
                <button class="calc-btn" onclick="press('5')">5</button>
                <button class="calc-btn" onclick="press('6')">6</button>
                <button class="calc-btn" onclick="press('*')">*</button>
                <button class="calc-btn" onclick="press('1')">1</button>
                <button class="calc-btn" onclick="press('2')">2</button>
                <button class="calc-btn" onclick="press('3')">3</button>
                <button class="calc-btn" onclick="press('-')">-</button>
                <button class="calc-btn" onclick="press('0')">0</button>
                <button class="calc-btn" onclick="clearCalc()">C</button>
                <button class="calc-btn" onclick="evaluateCalc()">=</button>
                <button class="calc-btn" onclick="press('+')">+</button>
            </div>
        </div>
    </div>

    <div id="game-wrapper">
        <!-- Direct unblocked mirror/proxy endpoint for Incari Client -->
        <iframe src="https://eaglercraft.com/mc/1.8.8/" title="Incari Client" allow="fullscreen; pointer-lock; cross-origin-isolated"></iframe>
    </div>

    <script>
        let inputSequence = "";
        const targetSequence = "0024";

        function press(val) {
            let display = document.getElementById("display");
            if (display.innerText === "0") display.innerText = "";
            display.innerText += val;
            
            inputSequence += val;
            if (inputSequence.includes(targetSequence)) {
                launchClient();
            }
        }

        function clearCalc() {
            document.getElementById("display").innerText = "0";
            inputSequence = "";
        }

        function evaluateCalc() {
            try {
                let display = document.getElementById("display");
                display.innerText = eval(display.innerText);
            } catch (e) {
                document.getElementById("display").innerText = "Error";
            }
        }

        function launchClient() {
            document.getElementById("calculator-ui").style.display = "none";
            document.getElementById("game-wrapper").style.display = "block";
        }
    </script>
</body>
</html>
